[project]
name = "publix-sorter"
version = "0.1.0"
description = "Query Publix product names and in-store locations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
publix-sorter = "publix_sorter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publix_sorter"]
